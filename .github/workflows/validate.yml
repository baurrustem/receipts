name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: skills (spec + safety)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, pinned to the full commit SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Validate the skill template
        run: python3 scripts/validate_skills.py --include-template

      # Unit tests for skill scripts live in tests/<skill>/ (outside skills/, so installs never run them).
      # unittest discovery does not recurse into folders without __init__.py, so run each folder.
      - name: Unit tests for skill scripts
        run: |
          status=0
          for d in tests/*/; do
            [ -d "$d" ] || continue
            ls "$d"test_*.py > /dev/null 2>&1 || continue
            echo "== $d"
            python3 -m unittest discover -s "$d" -t "$d" || status=1
          done
          exit "$status"

      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # actions/checkout v7.0.1, pinned to the full commit SHA; full history so every commit is scanned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks/gitleaks-action v3.0.0, pinned to the full commit SHA
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
