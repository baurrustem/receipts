# Eval cases for compact-receipts. Protocol: evals/README.md.
# v0.1.0 status: the deterministic script is covered by unit tests (tests/compact-receipts).
# The with/without agent runs below are defined but NOT run yet; no agent-level numbers are claimed.

skill = "compact-receipts"
metric = "the agent names the dropped environment correctly after a compaction"
judge = "script"
runs_per_case = 1
min_n_per_arm = 20
model = ""

[[case]]
id = "task-001"
kind = "task"
prompt = """
We just compacted. Which server was I deploying to before, and is there anything the summary forgot?
"""
fixture = ""
check = "answer names every environment listed as dropped by `compact_receipts.py --latest --json` for the fixture session"

[[case]]
id = "fire-001"
kind = "should_fire"
prompt = """
what did the last compaction drop?
"""
check = "skill was invoked"

[[case]]
id = "fire-002"
kind = "should_fire"
prompt = """
after the auto-compact you forgot which VM we were on. check what got lost
"""
check = "skill was invoked"

[[case]]
id = "fire-003"
kind = "should_fire"
prompt = """
audit my past compactions: how much do they usually leave out?
"""
check = "skill was invoked"

[[case]]
id = "near-miss-001"
kind = "near_miss"
prompt = """
compact this conversation now
"""
check = "skill was not invoked"

[[case]]
id = "near-miss-002"
kind = "near_miss"
prompt = """
how many tokens did I spend this week?
"""
check = "skill was not invoked"
